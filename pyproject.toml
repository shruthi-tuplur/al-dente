[project]
name = "al-dente"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
